<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 my-4">
    {% for product in products %}
    <div class="col">
        <div class="card h-100 shadow-sm">
            <!-- Изображение товара -->
            {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}" style="height: 220px; object-fit: cover;">
            {% else %}
                <img src="https://via.placeholder.com/300x200?text=No+Image" class="card-img-top" alt="No image">
            {% endif %}

            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text text-muted small">{{ product.description|truncatewords:10 }}</p>

                <div class="mt-auto d-flex justify-content-between align-items-center">
                    <span class="fw-bold fs-5">${{ product.price }}</span>
                    <a href="#" class="btn btn-outline-dark btn-sm">Подробнее</a>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <h4>Товары пока не добавлены</h4>
    </div>
    {% endfor %}
</div>
