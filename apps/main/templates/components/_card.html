<div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
    {% if product.image %}
        <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}" style="height: 220px; object-fit: cover;">
    {% else %}
        <div class="bg-light d-flex align-items-center justify-content-center" style="height: 220px;">
            <span class="text-muted">No photo</span>
        </div>
    {% endif %}

    <div class="card-body d-flex flex-column justify-content-between">
        <div>
            {% if product.category %}
                <span class="badge bg-secondary bg-opacity-10 text-secondary mb-2 rounded-pill">
                    {{ product.category.name }}
                </span>
            {% endif %}
            <h5 class="card-title fw-bold text-dark">{{ product.name }}</h5>
            <p class="card-text text-muted small">{{ product.description|truncatewords:8 }}</p>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="fw-bold fs-5 text-dark">${{ product.price }}</span>
            <a href="{% url 'product_detail' product.pk %}" class="btn btn-outline-dark btn-sm rounded-pill px-3">See more</a>
        </div>
    </div>
</div>
