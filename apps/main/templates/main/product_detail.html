{% extends 'base.html' %}


{% block title %}
{{ product.name }}
{% endblock %}


{% block content %}
<div class="container my-5">
    <a href="{% url 'shop' %}" class="btn btn-outline-secondary mb-4 rounded-pill">
        ← Back to Shop
    </a>

    <div class="row g-5">
        <div class="col-md-6">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="img-fluid rounded-4 shadow-sm w-100" alt="{{ product.name }}">
            {% else %}
                <div class="bg-light rounded-4 d-flex align-items-center justify-content-center" style="height: 400px;">
                    <i class="bi bi-image fs-1 text-muted"></i>
                </div>
            {% endif %}
        </div>

        <div class="col-md-6">
            <span class="badge bg-secondary bg-opacity-10 text-secondary mb-2 rounded-pill px-3">
                {{ product.category.name }}
            </span>
            <h1 class="fw-bold mb-3">{{ product.name }}</h1>
            <h2 class="text-dark fw-bold mb-4">${{ product.price }}</h2>

            <hr>

            <h5 class="fw-bold mt-4">Description</h5>
            <p class="text-muted leading-relaxed">{{ product.description }}</p>

            <button class="btn btn-dark btn-lg rounded-pill px-5 mt-4">
                Add to Cart
            </button>
        </div>
    </div>
</div>
{% endblock %}
