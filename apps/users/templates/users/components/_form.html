<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

      <div class="card-body p-4 p-md-5 bg-white">
        <form method="post" class="needs-validation">
          {% csrf_token %}

          {% if form.non_field_errors %}
            <div class="alert alert-danger py-2 mb-3 small">
              {% for error in form.non_field_errors %}
                <div>{{ error }}</div>
              {% endfor %}
            </div>
          {% endif %}

          <div class="user-form-fields mb-3">
            {{ form.as_p }}
          </div>

          <button type="submit" class="btn btn-warning w-100 fw-bold rounded-pill py-2 shadow-sm mt-3">
            Submit 🎸
          </button>
        </form>
      </div>

    </div>
  </div>
</div>

<style>
  .user-form-fields p {
    margin-bottom: 1rem;
  }
  .user-form-fields label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.4rem;
    color: #212529;
  }
  .user-form-fields input {
    width: 100%;
    padding: 0.5rem 0.75rem;
    border-radius: 0.5rem;
    border: 1px solid #ced4da;
    background-color: #f8f9fa;
    transition: all 0.2s ease-in-out;
  }
  .user-form-fields input:focus {
    background-color: #fff;
    border-color: #ffc107;
    box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
    outline: 0;
  }
  .user-form-fields .helptext {
    display: block;
    font-size: 0.8em;
    color: #6c757d;
    margin-top: 0.25rem;
  }
  .user-form-fields .errorlist {
    color: #dc3545;
    list-style: none;
    padding-left: 0;
    font-size: 0.85em;
    margin-top: 0.25rem;
    margin-bottom: 0;
  }
</style>
